name: AppImage
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    name: "AppImage (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-24.04, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, arch: aarch64 }
    container: ghcr.io/pkgforge-dev/archlinux:latest
    env:
      # Authenticated GitHub API calls in the pkgforge scripts; anonymous ones from runner IPs get 503s.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare container
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      - name: Install dependencies
        run: sh packaging/appimage/get-dependencies.sh
      - name: Stamp version
        id: version
        # major.minor come from xero_wallpapers/__init__.py, the patch number is this workflow's run number.
        run: |
          base=$(sed -n 's/^VERSION = "\([0-9]*\.[0-9]*\).*"$/\1/p' xero_wallpapers/__init__.py)
          version="${base}.${GITHUB_RUN_NUMBER}"
          sed -i "s/^VERSION = .*/VERSION = \"${version}\"/" xero_wallpapers/__init__.py
          sed -i "s|^UPDATE_REPO = .*|UPDATE_REPO = \"${GITHUB_REPOSITORY}\"|" xero_wallpapers/__init__.py
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"
      - name: Make AppImage
        run: OUTPATH="$PWD/dist" sh packaging/appimage/make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Checksums
        run: for f in *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - name: Release notes
        # Commits go straight to main, so the notes are their bullet bodies (or subjects) since the previous release.
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          for commit in $(git log --no-merges --format=%H ${previous:+"$previous"..}HEAD); do
            body=$(git log -1 --format=%b "$commit")
            if [ -n "$body" ]; then echo "$body"; else echo "- $(git log -1 --format=%s "$commit")"; fi
          done > notes.md
      - name: Publish release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Xero Wallpapers ${{ needs.build.outputs.version }}"
          make_latest: true
          body_path: notes.md
          generate_release_notes: true
          files: |
            *.AppImage
            *.AppImage.zsync
            *.AppImage.sha256
